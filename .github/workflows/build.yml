name: Build & Auto-Update (Shorebird)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'কী করতে চান?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - release_apk
          - release_aab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Generate Android files & Setup Shorebird
        run: |
          mkdir -p /tmp/custom_backup
          cp pubspec.yaml /tmp/custom_backup/pubspec.yaml
          cp -r lib /tmp/custom_backup/lib
          if [ -f shorebird.yaml ]; then
            cp shorebird.yaml /tmp/custom_backup/shorebird.yaml
            echo "FIRST_RUN=false" >> $GITHUB_ENV
          else
            echo "FIRST_RUN=true" >> $GITHUB_ENV
          fi

          flutter create . --project-name stylish_text_maker --org com.stylishtextmaker.app --platforms android
          cp /tmp/custom_backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/custom_backup/lib lib

          if [ -f /tmp/custom_backup/shorebird.yaml ]; then
            cp /tmp/custom_backup/shorebird.yaml shorebird.yaml
          else
            printf "\n" | shorebird init --force
            cp /tmp/custom_backup/pubspec.yaml pubspec.yaml
            echo "=== GENERATED SHOREBIRD.YAML ==="
            cat shorebird.yaml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shorebird.yaml
            git commit -m "Add shorebird.yaml [skip ci]" || true
            git push || true
          fi

      - name: Configure AndroidManifest, Security, minSdk, Lint, and Gradle
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          EOF

          python3 - << 'EOF'
          import os, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()

          m = re.sub(r'android:label="[^"]*"', 'android:label="Stylish Text Maker"', m)
          if 'android:allowBackup' not in m:
              m = m.replace('<application', '<application android:allowBackup="false"', 1)

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'
          )
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)

          queries = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <data android:scheme="https" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if 'android:scheme="https"' not in m:
              m = m.replace("</manifest>", queries + "</manifest>")

          with open(manifest_path, "w") as f:
              f.write(m)

          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  g = f.read()
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              if "checkReleaseBuilds" not in g:
                  g = re.sub(
                      r'^android\s*\{',
                      'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }',
                      g,
                      count=1,
                      flags=re.MULTILINE,
                  )
              if "isMinifyEnabled" not in g:
                  extra = (
                      'signingConfig = signingConfigs.getByName("debug")\n'
                      '            isMinifyEnabled = false\n'
                      '            isShrinkResources = false\n'
                      '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                  )
                  if 'signingConfig = signingConfigs.getByName("debug")' in g:
                      g = g.replace('signingConfig = signingConfigs.getByName("debug")', extra, 1)
                  else:
                      g = g.replace("release {", "release {\n            " + extra, 1)
              with open(kts_path, "w") as f:
                  f.write(g)

          groovy_path = "android/app/build.gradle"
          if os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  g = f.read()
              g = g.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              if "checkReleaseBuilds" not in g:
                  g = re.sub(
                      r'^android\s*\{',
                      'android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }',
                      g,
                      count=1,
                      flags=re.MULTILINE,
                  )
              if "minifyEnabled" not in g:
                  extra_g = (
                      "release {\n"
                      "            minifyEnabled false\n"
                      "            shrinkResources false\n"
                      "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
                  )
                  g = g.replace("release {", extra_g, 1)
              with open(groovy_path, "w") as f:
                  f.write(g)
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Shorebird Release APK
        if: env.FIRST_RUN == 'true' || github.event.inputs.mode == 'release_apk'
        run: shorebird release android --artifact apk --no-confirm

      - name: Run Shorebird Release AAB
        if: github.event.inputs.mode == 'release_aab'
        run: shorebird release android --artifact aab --no-confirm

      - name: Run Shorebird Auto-Update Patch
        if: env.FIRST_RUN != 'true' && github.event.inputs.mode != 'release_apk' && github.event.inputs.mode != 'release_aab'
        run: |
          RELEASE_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          shorebird patch android --release-version="$RELEASE_VER" --allow-native-diffs --allow-asset-diffs --no-confirm

      - name: Upload Shorebird APK
        if: env.FIRST_RUN == 'true' || github.event.inputs.mode == 'release_apk'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Shorebird AAB
        if: github.event.inputs.mode == 'release_aab'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
