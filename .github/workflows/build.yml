name: Build & Auto-Update (Shorebird)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'কী করতে চান?'
        required: true
        default: 'release_apk'
        type: choice
        options:
          - patch
          - release_apk
          - release_aab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Generate Android files & Setup Shorebird
        run: |
          mkdir -p /tmp/custom_backup
          cp pubspec.yaml /tmp/custom_backup/pubspec.yaml
          cp -r lib /tmp/custom_backup/lib
          if [ -f shorebird.yaml ]; then
            cp shorebird.yaml /tmp/custom_backup/shorebird.yaml
          fi

          flutter create . --project-name stylish_text_maker --org com.arghodev --platforms android
          cp /tmp/custom_backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/custom_backup/lib lib

          if [ -f /tmp/custom_backup/shorebird.yaml ]; then
            cp /tmp/custom_backup/shorebird.yaml shorebird.yaml
          else
            printf "\n" | shorebird init --force
            cp /tmp/custom_backup/pubspec.yaml pubspec.yaml
          fi

      - name: Configure Release Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-key.jks
          EOF
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Configure AndroidManifest, Security, minSdk, Lint, and Gradle
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          EOF

          python3 - << 'EOF'
          import os, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()

          m = re.sub(r'android:label="[^"]*"', 'android:label="Stylish Text Maker"', m)
          if 'android:allowBackup' not in m:
              m = m.replace('<application', '<application android:allowBackup="false"', 1)

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'
          )
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)

          queries = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <data android:scheme="https" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if 'android:scheme="https"' not in m:
              m = m.replace("</manifest>", queries + "</manifest>")

          with open(manifest_path, "w") as f:
              f.write(m)

          has_ks = os.environ.get("HAS_KEYSTORE") == "true"

          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  g = f.read()
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              g = g.replace('applicationId = "com.arghodev.stylish_text_maker"', 'applicationId = "com.arghodev.stylishtextmaker"')

              if has_ks and "key.properties" not in g:
                  props_header = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  g = props_header + g

              if "checkReleaseBuilds" not in g:
                  g = re.sub(
                      r'^android\s*\{',
                      'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }',
                      g,
                      count=1,
                      flags=re.MULTILINE,
                  )

              if has_ks and 'signingConfigs.create("release")' not in g:
                  signing_block = (
                      '    signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties.getProperty("keyAlias")\n'
                      '            keyPassword = keystoreProperties.getProperty("keyPassword")\n'
                      '            storeFile = file(keystoreProperties.getProperty("storeFile"))\n'
                      '            storePassword = keystoreProperties.getProperty("storePassword")\n'
                      '        }\n'
                      '    }\n'
                      '    buildTypes {'
                  )
                  g = g.replace("    buildTypes {", signing_block, 1)

              if "isMinifyEnabled" not in g:
                  sign_ref = 'signingConfigs.getByName("release")' if has_ks else 'signingConfigs.getByName("debug")'
                  extra = (
                      f'signingConfig = {sign_ref}\n'
                      '            isMinifyEnabled = false\n'
                      '            isShrinkResources = false\n'
                      '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                  )
                  if 'signingConfig = signingConfigs.getByName("debug")' in g:
                      g = g.replace('signingConfig = signingConfigs.getByName("debug")', extra, 1)
                  else:
                      g = g.replace("release {", "release {\n            " + extra, 1)

              with open(kts_path, "w") as f:
                  f.write(g)
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Shorebird Release APK
        if: github.event.inputs.mode == 'release_apk' || github.event_name == 'push'
        run: shorebird release android --artifact apk --no-confirm

      - name: Run Shorebird Release AAB
        if: github.event.inputs.mode == 'release_aab'
        run: shorebird release android --artifact aab --no-confirm

      - name: Run Shorebird Auto-Update Patch
        if: github.event.inputs.mode == 'patch'
        run: |
          RELEASE_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          shorebird patch android --release-version="$RELEASE_VER" --allow-native-diffs --allow-asset-diffs --no-confirm

      - name: Upload Shorebird APK
        if: github.event.inputs.mode == 'release_apk' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Shorebird AAB
        if: github.event.inputs.mode == 'release_aab'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
