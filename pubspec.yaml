name: stylish_text_maker
description: Stylish Text, Symbols, Image to Text, Image Resizer & YT Thumbnail App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.14.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  image: ^4.10.0
  flutter_image_compress: ^2.5.0
  gal: ^3.0.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
